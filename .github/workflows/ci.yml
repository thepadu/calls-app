name: CI

# Runs on every push and PR against main. IMPORTANT LIMITATION — see
# DECISIONS.md's 2026-09-07 entry: this makes a bad commit visible (a red
# X on GitHub) but does NOT currently block calls-app's deploy. DigitalOcean
# App Platform's auto-deploy (deploy_on_push in its App Spec) fires off the
# same git push webhook this workflow reacts to — the two run in parallel,
# neither waits for the other. Turning this into a real gate needs
# deploy_on_push switched off and DigitalOcean's own deploy step added here,
# behind a DIGITALOCEAN_ACCESS_TOKEN repo secret — both need someone with
# access to the DO dashboard and this repo's GitHub settings to set up.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calls-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calls-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: calls-app/package-lock.json
      - run: npm ci
      - run: npm test

  ari-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ari-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ari-app/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b as part of the build is the one thing that catches a real
      # class of bug none of the tests above do — a type error that
      # compiles under Vite's dev server but breaks the production build.
      - run: npm run build
