# Prevents needrestart from silently auto-restarting Asterisk / the ARI
# call-control app / coturn after a routine package upgrade. Confirmed live
# on 2026-08-25: a libcurl security patch triggered needrestart, which
# restarted asterisk.service and chumz-ari-app.service at 06:38:59 with no
# active-call check and no human involved — dropping every live call
# system-wide with zero warning. A drop-in (not an edit to the
# package-owned needrestart.conf) so package upgrades of needrestart itself
# never silently discard this override.
#
# override_rc => 0 means "never auto-restart", matching how the distro
# default already treats dbus/NetworkManager/etc. The %{$nrconf{override_rc}}
# spread merges onto those existing entries instead of replacing them.
$nrconf{override_rc} = {
    %{$nrconf{override_rc}},
    qr(^asterisk) => 0,
    qr(^chumz-ari-app) => 0,
    qr(^coturn) => 0,
};
