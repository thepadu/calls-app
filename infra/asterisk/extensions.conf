[from-at-trunk]
; Real inbound calls go into the ARI app (chumz-ivr) — it decides what
; happens from here (IVR menu, queue, agent routing).
exten => _+X.,1,NoOp(Inbound call from AT trunk to ${EXTEN}, from ${CALLERID(num)})
exten => _+X.,n,Stasis(chumz-ivr)
exten => _+X.,n,Hangup()

[test-webrtc]
; test1/test2 can still call each other directly (Phase 1 proof-of-concept).
exten => test1,1,Dial(PJSIP/test1,30)
exten => test2,1,Dial(PJSIP/test2,30)

; A registered WebRTC endpoint dialing an E.164 number goes out through the
; AT trunk. Routed through Stasis (not a bare Dial()) so the ARI app can log
; the call in call_logs (direction=Outbound, tagged with the placing agent)
; and control caller ID / bridging itself — see handleOutboundAgentCall in
; ari-app/index.js.
exten => _+X.,1,NoOp(Outbound call from ${CALLERID(num)} (${CHANNEL(endpoint)}) to ${EXTEN})
exten => _+X.,n,Stasis(chumz-ivr,outbound-agent:${EXTEN})
exten => _+X.,n,Hangup()

; Agent-to-agent calling: a reserved 9<agentId> extension, distinct from
; real E.164 numbers (which always start with the literal + matched by
; _+X. above, so there is no collision). Routed the same way, just tagged
; differently so ari-app dials the target's own PJSIP endpoint instead of
; the AT trunk — see handleInternalAgentCall in ari-app/index.js.
exten => _9.,1,NoOp(Internal call from ${CALLERID(num)} (${CHANNEL(endpoint)}) to agent ${EXTEN:1})
; The _9. wildcard matches any character after the leading 9, not just
; digits, and EXTEN gets interpolated straight into a comma-delimited
; Stasis() argument list below -- reject anything non-numeric before it
; ever reaches there, rather than relying solely on ari-app to make
; sense of a malformed target id.
exten => _9.,n,GotoIf($["${FILTER(0-9,${EXTEN:1})}" != "${EXTEN:1}"]?invalid)
exten => _9.,n,Stasis(chumz-ivr,internal-agent:${EXTEN:1})
exten => _9.,n,Hangup()
exten => _9.,n(invalid),NoOp(Rejected non-numeric internal-call extension: ${EXTEN:1})
exten => _9.,n,Hangup()

[forward-external]
; Reached via ARI's continueInDialplan when no agents are online at all —
; the customer's FORWARD_DEST channel variable holds the configured
; forwarding_rules destination.
exten => s,1,NoOp(Forwarding to ${FORWARD_DEST} — no agents online)
exten => s,n,Dial(PJSIP/${FORWARD_DEST}@at-trunk,30)
exten => s,n,Hangup()


[ari-heartbeat-sink]
; Permanent — landing spot for the paired half of the Local channel
; ari-app originates every 15s to verify its own StasisStart event
; delivery is actually working, not just that the ARI REST API answers.
; See checkAriEventDelivery in ari-app/index.js.
exten => _.,1,Answer()
exten => _.,n,Wait(3600)
exten => _.,n,Hangup()
