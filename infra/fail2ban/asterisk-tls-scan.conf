# Fail2Ban filter for TLS handshake scanning against Asterisk's public WSS
# port (8089). These never complete a real TLS handshake, so they can never
# be a genuine softphone client -- confirmed distinct from the existing
# asterisk.conf filter, which only matches NOTICE/SECURITY/WARNING-prefixed
# SIP-auth-failure lines and never sees these ERROR-prefixed lines at all
# (that filter's own prefregex excludes them), leaving this traffic
# completely unbanned before this filter was added.
#
# The leading '[]' below isn't a typo: fail2ban's {^LN-BEG} date detection
# extracts just the date TEXT from inside this log's '[Mon DD HH:MM:SS]'
# bracket, leaving both now-empty brackets adjacent in the remaining text
# handed to failregex -- verified directly with fail2ban-regex against a
# real sample line before relying on it here.

[Definition]

failregex = ^\[\] ERROR\[\d+\] tcptls\.c: Unable to set up ssl connection with peer '<HOST>:\d+'$

ignoreregex =

datepattern = {^LN-BEG}
