<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Hanging up automatically opens the wrap-up prompt, which creates a ticket. Pressing E skips straight to the wrap-up prompt before hang-up; pressing T logs a quick ticket directly, at any point mid-call.">
  <rect x="1" y="1" width="898" height="338" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>

  <defs>
    <marker id="arrowDark3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C3E50"/>
    </marker>
    <marker id="arrowAccent3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E7A6E"/>
    </marker>
    <marker id="arrowMuted3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B96A3"/>
    </marker>
  </defs>

  <text x="26" y="30" font-size="15" font-weight="700" fill="#2C3E50">From hang-up to ticket</text>

  <!-- skip arrows drawn first, so the main row sits on top -->
  <path d="M 90 112 C 90 190, 521 190, 521 112" fill="none" stroke="#8B96A3" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowMuted3)"/>
  <text x="305" y="212" font-size="10.5" text-anchor="middle" fill="#8B96A3">press E — opens wrap-up early, before hang-up</text>

  <path d="M 130 112 L 130 300 L 776 300 L 776 112" fill="none" stroke="#8B96A3" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowMuted3)"/>
  <text x="453" y="292" font-size="10.5" text-anchor="middle" fill="#8B96A3">press T — logs a ticket directly, any time mid-call</text>

  <!-- main row -->
  <rect x="26" y="58" width="150" height="54" rx="10" fill="#F1F6F5" stroke="#CBD8D5"/>
  <text x="101" y="90" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2C3E50">On a call</text>

  <rect x="236" y="58" width="130" height="54" rx="10" fill="#F1F6F5" stroke="#CBD8D5"/>
  <text x="301" y="90" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2C3E50">Hang up</text>

  <rect x="426" y="58" width="190" height="54" rx="10" fill="#FFFFFF" stroke="#17A697" stroke-width="1.5"/>
  <text x="521" y="82" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0E7A6E">Wrap-up prompt</text>
  <text x="521" y="99" font-size="10.5" text-anchor="middle" fill="#6B7280">opens automatically</text>

  <rect x="676" y="58" width="200" height="54" rx="10" fill="#17A697" stroke="#0E7A6E" stroke-width="1.5"/>
  <text x="776" y="82" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">Ticket created</text>
  <text x="776" y="99" font-size="10.5" text-anchor="middle" fill="#E7FBF7">on Tags &amp; Tickets</text>

  <line x1="176" y1="85" x2="232" y2="85" stroke="#2C3E50" stroke-width="1.6" marker-end="url(#arrowDark3)"/>
  <line x1="366" y1="85" x2="422" y2="85" stroke="#2C3E50" stroke-width="1.6" marker-end="url(#arrowDark3)"/>
  <line x1="616" y1="85" x2="672" y2="85" stroke="#0E7A6E" stroke-width="1.6" marker-end="url(#arrowAccent3)"/>
  <text x="600" y="30" font-size="10.5" text-anchor="middle" fill="#6B7280">pick a disposition, then</text>
  <text x="600" y="43" font-size="10.5" text-anchor="middle" fill="#6B7280">"Finish &amp; log call"</text>
</svg>
