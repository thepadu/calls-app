<svg viewBox="0 0 900 356" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A waiting caller rings every available agent's browser at once; Agent B answers first and the call connects, while Agent A and Agent C stop ringing.">
  <rect x="1" y="1" width="898" height="354" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>

  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C3E50"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA6AD"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E7A6E"/>
    </marker>
  </defs>

  <text x="28" y="34" font-size="15" font-weight="700" fill="#2C3E50">How a call reaches you</text>

  <!-- Caller -->
  <rect x="24" y="150" width="120" height="52" rx="10" fill="#F1F6F5" stroke="#CBD8D5"/>
  <text x="84" y="181" font-size="13" text-anchor="middle" fill="#2C3E50">Caller</text>

  <!-- Queue -->
  <rect x="210" y="150" width="110" height="52" rx="10" fill="#F1F6F5" stroke="#CBD8D5"/>
  <text x="265" y="181" font-size="13" text-anchor="middle" fill="#2C3E50">Queue</text>

  <line x1="144" y1="176" x2="206" y2="176" stroke="#2C3E50" stroke-width="1.6" marker-end="url(#arrowDark)"/>

  <!-- Agents -->
  <rect x="470" y="34" width="190" height="56" rx="10" fill="#F1F6F5" stroke="#CBD8D5" stroke-dasharray="4 3"/>
  <text x="565" y="58" font-size="12.5" text-anchor="middle" fill="#6B7280">Agent A</text>
  <text x="565" y="76" font-size="11" text-anchor="middle" fill="#6B7280">Available</text>

  <rect x="470" y="150" width="190" height="56" rx="10" fill="#17A697" stroke="#0E7A6E" stroke-width="1.5"/>
  <text x="565" y="174" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">Agent B</text>
  <text x="565" y="192" font-size="11" text-anchor="middle" fill="#E7FBF7">Available</text>

  <rect x="470" y="266" width="190" height="56" rx="10" fill="#F1F6F5" stroke="#CBD8D5" stroke-dasharray="4 3"/>
  <text x="565" y="290" font-size="12.5" text-anchor="middle" fill="#6B7280">Agent C</text>
  <text x="565" y="308" font-size="11" text-anchor="middle" fill="#6B7280">Available</text>

  <!-- fan out lines -->
  <line x1="320" y1="176" x2="466" y2="64" stroke="#9CA6AD" stroke-width="1.4" marker-end="url(#arrowMuted)"/>
  <line x1="320" y1="176" x2="466" y2="178" stroke="#2C3E50" stroke-width="1.6" marker-end="url(#arrowDark)"/>
  <line x1="320" y1="176" x2="466" y2="294" stroke="#9CA6AD" stroke-width="1.4" marker-end="url(#arrowMuted)"/>

  <text x="340" y="120" font-size="11.5" fill="#6B7280">rings every Available</text>
  <text x="340" y="134" font-size="11.5" fill="#6B7280">agent's browser at once</text>

  <!-- outcome -->
  <rect x="716" y="150" width="160" height="56" rx="10" fill="#FFFFFF" stroke="#17A697" stroke-width="1.5"/>
  <text x="796" y="174" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0E7A6E">Call connects</text>
  <text x="796" y="192" font-size="11" text-anchor="middle" fill="#6B7280">for Agent B</text>

  <line x1="660" y1="178" x2="712" y2="178" stroke="#0E7A6E" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
  <text x="666" y="164" font-size="11" fill="#0E7A6E">answers first</text>

  <text x="565" y="122" font-size="10.5" fill="#9CA6AD" text-anchor="middle">ringing stops</text>
  <text x="565" y="350" font-size="10.5" fill="#9CA6AD" text-anchor="middle">ringing stops</text>
</svg>
