<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A supervisor's sidebar has every page an agent's sidebar has, plus four supervisor-only pages: Analytics, Agents, IVR Builder, and Settings.">
  <rect x="1" y="1" width="698" height="498" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>

  <text x="26" y="32" font-size="15" font-weight="700" fill="#2C3E50">Who sees what in the sidebar</text>

  <!-- Agent panel -->
  <rect x="40" y="56" width="260" height="244" rx="12" fill="#F9FBFA" stroke="#CBD8D5"/>
  <rect x="40" y="56" width="260" height="40" rx="12" fill="#2C3E50"/>
  <rect x="40" y="80" width="260" height="16" fill="#2C3E50"/>
  <text x="170" y="81" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">Agent</text>

  <g font-size="12.5" fill="#2C3E50">
    <rect x="56" y="104" width="228" height="34" rx="7" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="70" y="126">Dashboard</text>
    <rect x="56" y="144" width="228" height="34" rx="7" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="70" y="166">Live Queue</text>
    <rect x="56" y="184" width="228" height="34" rx="7" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="70" y="206">Calls</text>
    <rect x="56" y="224" width="228" height="34" rx="7" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="70" y="246">Tags &amp; Tickets</text>
    <rect x="56" y="264" width="228" height="34" rx="7" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="70" y="286">Contacts</text>
  </g>

  <!-- Supervisor panel -->
  <rect x="400" y="56" width="260" height="404" rx="12" fill="#F9FBFA" stroke="#CBD8D5"/>
  <rect x="400" y="56" width="260" height="40" rx="12" fill="#2C3E50"/>
  <rect x="400" y="80" width="260" height="16" fill="#2C3E50"/>
  <text x="530" y="81" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">Supervisor</text>

  <g font-size="12.5" fill="#2C3E50">
    <rect x="416" y="104" width="228" height="34" rx="7" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="430" y="126">Dashboard</text>
    <rect x="416" y="144" width="228" height="34" rx="7" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="430" y="166">Live Queue</text>
    <rect x="416" y="184" width="228" height="34" rx="7" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="430" y="206">Calls</text>
    <rect x="416" y="224" width="228" height="34" rx="7" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="430" y="246">Tags &amp; Tickets</text>
    <rect x="416" y="264" width="228" height="34" rx="7" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="430" y="286">Contacts</text>
  </g>

  <line x1="416" y1="312" x2="644" y2="312" stroke="#CBD8D5" stroke-dasharray="3 3"/>
  <text x="530" y="330" font-size="10.5" text-anchor="middle" fill="#0E7A6E" font-weight="700">SUPERVISOR ONLY</text>

  <g font-size="12.5" fill="#0E7A6E" font-weight="700">
    <rect x="416" y="344" width="228" height="34" rx="7" fill="#E7F6F3" stroke="#17A697"/>
    <rect x="416" y="344" width="4" height="34" fill="#17A697"/>
    <text x="430" y="366">Analytics</text>
    <rect x="416" y="384" width="228" height="34" rx="7" fill="#E7F6F3" stroke="#17A697"/>
    <rect x="416" y="384" width="4" height="34" fill="#17A697"/>
    <text x="430" y="406">Agents</text>
    <rect x="416" y="424" width="228" height="34" rx="7" fill="#E7F6F3" stroke="#17A697"/>
    <rect x="416" y="424" width="4" height="34" fill="#17A697"/>
    <text x="430" y="446">IVR Builder</text>
    <rect x="416" y="464" width="228" height="34" rx="7" fill="#E7F6F3" stroke="#17A697"/>
    <rect x="416" y="464" width="4" height="34" fill="#17A697"/>
    <text x="430" y="486">Settings</text>
  </g>
</svg>
