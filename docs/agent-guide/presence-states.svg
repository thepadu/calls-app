<svg viewBox="0 0 780 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Available leads to Ringing and then On call automatically as calls arrive and end; Break and Offline are states you switch into yourself.">
  <rect x="1" y="1" width="778" height="348" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>

  <defs>
    <marker id="arrowDark2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C3E50"/>
    </marker>
    <marker id="arrowMuted2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B96A3"/>
    </marker>
  </defs>

  <text x="26" y="28" font-size="15" font-weight="700" fill="#2C3E50">Your status, and who changes it</text>

  <!-- return arc: On call -> Available (drawn first so it sits behind the boxes) -->
  <path d="M 655 86 C 655 18, 105 18, 105 86" fill="none" stroke="#2C3E50" stroke-width="1.6" marker-end="url(#arrowDark2)"/>
  <text x="380" y="54" font-size="10.5" text-anchor="middle" fill="#6B7280">you hang up</text>
  <text x="380" y="67" font-size="10" text-anchor="middle" fill="#9CA6AD">(system ends the call)</text>

  <!-- top row -->
  <rect x="30" y="86" width="150" height="54" rx="10" fill="#17A697" stroke="#0E7A6E" stroke-width="1.5"/>
  <text x="105" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">Available</text>

  <rect x="305" y="86" width="150" height="54" rx="10" fill="#FDF1DC" stroke="#F39C12" stroke-width="1.5"/>
  <text x="380" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#8A5A00">Ringing</text>

  <rect x="580" y="86" width="150" height="54" rx="10" fill="#E7F6F3" stroke="#4DB8AA" stroke-width="1.5"/>
  <text x="655" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#0E7A6E">On call</text>

  <line x1="180" y1="113" x2="301" y2="113" stroke="#2C3E50" stroke-width="1.6" marker-end="url(#arrowDark2)"/>
  <text x="187" y="107" font-size="10.5" fill="#6B7280">caller rings in</text>
  <text x="212" y="134" font-size="10" fill="#9CA6AD">(system)</text>

  <line x1="455" y1="113" x2="576" y2="113" stroke="#2C3E50" stroke-width="1.6" marker-end="url(#arrowDark2)"/>
  <text x="472" y="107" font-size="10.5" fill="#6B7280">you answer</text>
  <text x="490" y="134" font-size="10" fill="#9CA6AD">(system)</text>

  <!-- bottom row -->
  <rect x="30" y="256" width="150" height="54" rx="10" fill="#EAF1F8" stroke="#5B8DBE" stroke-width="1.5"/>
  <text x="105" y="288" font-size="13" font-weight="700" text-anchor="middle" fill="#2C3E50">Break</text>

  <rect x="305" y="256" width="150" height="54" rx="10" fill="#F2F3F4" stroke="#9CA6AD" stroke-width="1.5"/>
  <text x="380" y="288" font-size="13" font-weight="700" text-anchor="middle" fill="#2C3E50">Offline</text>

  <!-- Available <-> Break -->
  <line x1="105" y1="140" x2="105" y2="252" stroke="#2C3E50" stroke-width="1.6" marker-end="url(#arrowDark2)" marker-start="url(#arrowDark2)"/>
  <text x="115" y="200" font-size="10.5" fill="#6B7280">you</text>

  <!-- Break <-> Offline -->
  <line x1="184" y1="283" x2="301" y2="283" stroke="#2C3E50" stroke-width="1.6" marker-end="url(#arrowDark2)" marker-start="url(#arrowDark2)"/>
  <text x="220" y="274" font-size="10.5" fill="#6B7280">you</text>

  <!-- Available -> Offline (sign out) -->
  <line x1="178" y1="132" x2="309" y2="260" stroke="#8B96A3" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowMuted2)"/>
  <text x="200" y="204" font-size="10.5" fill="#8B96A3">you (sign out)</text>
</svg>
